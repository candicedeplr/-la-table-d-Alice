<style>
:root{
  --bg:#F3EFE6; --card:#FBF9F3; --line:#E7E0CE; --ink:#3A3628; --muted:#8A836E; --muted2:#A69F8B;
  --accent:#B24A34; --good:#4C7A52; --goodbg:#EAF1E6; --neutre:#8A836E; --neutrebg:#EFE9DC;
  --mild:#B8763A; --mildbg:#FBEBD9; --strong:#B0392A; --strongbg:#FBE7E3; --track:#E9DFC9;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{font-family:'Karla',sans-serif;padding-bottom:40px;}
.serif{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea,select{font-family:inherit;font-size:14px;}
input:focus,textarea:focus,select:focus,button:focus{outline:2px solid var(--accent);outline-offset:1px;}
.wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;}
.hidden{display:none!important;}

.header{padding:18px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between;}
.htitle{display:flex;gap:10px;align-items:flex-start;}
.htitle .emoji{font-size:26px;line-height:1;margin-top:2px;}
.htitle h1{font-size:20px;margin:0;line-height:1.2;}
.htitle .sub{font-size:13px;color:var(--muted);margin-top:2px;}
.gearbtn{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.gearbtn svg{width:17px;height:17px;stroke:var(--muted);}

.settings-panel{margin:0 20px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
.settings-row{padding:9px 0;}
.settings-row:not(:last-child){border-bottom:1px solid var(--line);}
.settings-label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px;display:block;}
.langtoggle{display:flex;background:var(--bg);border-radius:999px;overflow:hidden;width:fit-content;}
.langtoggle span{padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted);}
.langtoggle span.active{background:var(--ink);color:var(--card);}
.testerlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.testerchip{display:flex;align-items:center;gap:5px;background:var(--bg);border-radius:999px;padding:5px 6px 5px 11px;font-size:12px;font-weight:600;}
.testerchip button{display:flex;}
.testerchip svg{width:12px;height:12px;stroke:var(--muted);}
.addtesterrow{display:flex;gap:6px;}
.addtesterrow input{flex:1;padding:7px 10px;border-radius:8px;border:1px solid #DDD5C2;background:#FFFEFB;}
.addtesterrow button{padding:7px 12px;border-radius:8px;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;}
.resetbtn{font-size:12.5px;color:var(--strong);font-weight:600;}

.stats{display:flex;gap:10px;margin:0 20px 16px;}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.stat .num{font-size:19px;}
.stat .lbl{font-size:10px;letter-spacing:.04em;color:var(--muted);margin-top:2px;text-transform:uppercase;font-weight:600;}
.bar{height:4px;border-radius:999px;background:var(--track);margin-top:9px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:999px;}

.tabs{display:flex;margin:0 20px;border-bottom:1px solid var(--line);}
.tab{flex:1;text-align:center;padding:10px 0 12px;font-size:14px;font-weight:700;color:var(--muted2);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.on{color:var(--accent);border-color:var(--accent);}

.catfilters{display:flex;gap:6px;overflow-x:auto;padding:2px 20px 10px;margin:0 -20px;}
.catfilters::-webkit-scrollbar{display:none;}
.catchip{flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted);}
.catchip.on{background:var(--ink);color:var(--card);border-color:var(--ink);}

.listpanel{margin:0 20px;background:var(--card);border:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;}
.foodrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);}
.foodrow:last-child{border-bottom:none;}
.f-emoji{font-size:20px;flex-shrink:0;width:24px;text-align:center;}
.f-mid{flex:1;min-width:0;display:flex;align-items:center;gap:7px;}
.f-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.f-age{font-size:11px;color:var(--muted2);background:var(--bg);padding:2px 7px;border-radius:999px;flex-shrink:0;}
.f-dot{width:6px;height:6px;border-radius:50%;background:var(--strong);flex-shrink:0;}
.pill{flex-shrink:0;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap;}
.pill.a_tester{background:var(--bg);color:var(--muted);}
.pill.aime{background:var(--goodbg);color:var(--good);}
.pill.neutre{background:var(--neutrebg);color:var(--neutre);}
.pill.pas_aime{background:var(--mildbg);color:var(--mild);}
.pill.reaction{background:var(--strongbg);color:var(--strong);}
.empty{text-align:center;padding:36px 20px;color:var(--muted2);font-size:13.5px;}

.allergenpanel{margin:0 20px;background:var(--card);border:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;}
.a-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);}
.a-row:last-child{border-bottom:none;}
.a-left{display:flex;align-items:center;gap:10px;}
.a-dot2{width:9px;height:9px;border-radius:50%;background:var(--muted2);}
.a-row.tested .a-dot2{background:var(--good);}
.a-name{font-size:13.5px;font-weight:600;}
.a-status{font-size:11.5px;color:var(--muted2);}
.a-row.tested .a-status{color:var(--good);}

.choicecard{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);margin-bottom:12px;text-align:left;}
.choicecard-emoji{font-size:26px;flex-shrink:0;}
.choicecard-text{display:flex;flex-direction:column;gap:2px;}
.choicecard-title{font-size:14.5px;font-weight:700;color:var(--ink);}
.choicecard-sub{font-size:12px;color:var(--muted);line-height:1.35;}

.centerscreen{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;}
.muted{color:var(--muted);}
.onboard-icon{font-size:40px;text-align:center;margin-bottom:14px;}
.btn-cancel-outline{padding:12px;border-radius:11px;font-weight:600;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line);text-align:center;}
.familycard{margin:0 20px 14px;padding:12px 14px;background:var(--goodbg);border:1px solid #C7DABE;border-radius:12px;}
.familycard .code{font-family:'Fraunces',serif;font-size:20px;letter-spacing:2px;color:var(--ink);}
.copybtn{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:8px;background:var(--card);border:1px solid #DDD5C2;color:var(--ink);}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;}

.fab{position:fixed;bottom:22px;right:24px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#FBF9F3;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(178,74,52,.35);z-index:25;}
.fab svg{width:23px;height:23px;}

.overlay{position:fixed;inset:0;background:rgba(58,54,40,.4);z-index:30;display:flex;align-items:flex-end;}
.sheet{width:100%;max-width:480px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:10px 20px 24px;}
.sheet-handle{width:36px;height:4px;background:var(--muted2);border-radius:999px;margin:0 auto 16px;opacity:.5;}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.sheet-head .emoji{font-size:26px;}
.sheet-head h2{font-size:22px;margin:0;}
.infobox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink);line-height:1.45;margin-bottom:12px;}
.infobox i{color:var(--muted);}
.recipebtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:18px;}
.recipebtn svg{width:16px;height:16px;flex-shrink:0;}
.field-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
.etatgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:18px;}
.etatgrid .wide{grid-column:span 3;}
.etatbtn{padding:11px 6px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;text-align:center;color:var(--ink);}
.etatbtn.on{border-color:var(--ink);background:var(--ink);color:var(--card);}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=number],.sheet select,.sheet textarea{
  width:100%;padding:10px 13px;border-radius:10px;border:1px solid #DDD5C2;background:#FFFEFB;color:var(--ink);margin-bottom:18px;
}
.sheet textarea{resize:none;}
.sheet-actions{display:flex;gap:10px;}
.btn-cancel{flex:1;padding:12px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted);text-align:center;}
.btn-save{flex:2;padding:12px;border-radius:11px;font-weight:600;font-size:14px;background:var(--accent);color:#FBF9F3;text-align:center;}
</style>

/* ================= STATE ================= */
let state = {
  stage:'loading', // loading | welcome | join | main
  familyCode:null, joinInput:'', joinError:'',
  lang:'fr', activeTab:'foods', activeCategory:'all', showSettings:false,
  entries:{}, customFoods:[], testers:[],
  sheet:null, // null | {mode:'edit', foodId} | {mode:'new'}
  draft:null,
  syncing:false, copied:false,
};

const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function genCode(){ let c=''; for(let i=0;i<6;i++) c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return c; }

function loadLang(){ try{ const l = localStorage.getItem('atable-lang'); if(l) state.lang = l; }catch(err){} }
function saveLang(){ try{ localStorage.setItem('atable-lang', state.lang); }catch(err){} }

let unsubscribe = null;
function familyDoc(code){ return db.collection('families').doc(code); }

async function initFromLocalCode(){
  loadLang();
  if(!firebaseReady){ state.stage='nofirebase'; render(); return; }
  let code = null;
  try{ code = localStorage.getItem('atable-family-code'); }catch(err){}
  if(code){
    state.familyCode = code;
    subscribeFamily(code);
  } else {
    state.stage = 'welcome'; render();
  }
}

function subscribeFamily(code){
  state.stage='main';
  if(unsubscribe) unsubscribe();
  unsubscribe = familyDoc(code).onSnapshot(snap=>{
    const data = snap.data() || {};
    state.entries = data.entries || {};
    state.customFoods = data.customFoods || [];
    state.testers = data.testers || [];
    state.syncing = false;
    render();
  }, err=>{ console.error(err); });
}

async function createFamily(){
  const code = genCode();
  try{
    await familyDoc(code).set({ entries:{}, customFoods:[], testers:[] });
    try{ localStorage.setItem('atable-family-code', code); }catch(err){}
    state.familyCode = code;
    subscribeFamily(code);
  }catch(err){ console.error(err); }
}

async function attemptJoin(){
  const code = state.joinInput.trim().toUpperCase();
  if(code.length < 4){ state.joinError = t().codeTooShort; render(); return; }
  try{
    const snap = await familyDoc(code).get();
    if(snap.exists){
      try{ localStorage.setItem('atable-family-code', code); }catch(err){}
      state.familyCode = code;
      state.joinError='';
      subscribeFamily(code);
    } else {
      state.joinError = t().codeNotFound; render();
    }
  }catch(err){ state.joinError = t().codeNotFound; render(); }
}

async function leaveFamily(){
  if(unsubscribe) unsubscribe();
  try{ localStorage.removeItem('atable-family-code'); }catch(err){}
  state.familyCode=null; state.entries={}; state.customFoods=[]; state.testers=[];
  state.showSettings=false; state.stage='welcome';
  render();
}

async function pushUpdate(partial){
  if(!state.familyCode) return;
  state.syncing = true;
  try{ await familyDoc(state.familyCode).set(partial, {merge:true}); }
  catch(err){ console.error(err); }
}
function saveEntries(){ pushUpdate({entries: state.entries}); }
function saveCustom(){ pushUpdate({customFoods: state.customFoods}); }
function saveTesters(){ pushUpdate({testers: state.testers}); }

function t(){ return T[state.lang]; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function allFoods(){ return FOOD_DB.concat(state.customFoods).sort((a,b)=>foodName(a).localeCompare(foodName(b), state.lang)); }
function getEntry(id){ return state.entries[id] || {etat:'a_tester', date:'', testedBy:'', notes:''}; }
function formatDate(iso){ if(!iso) return ''; return new Date(iso).toLocaleDateString(state.lang==='fr'?'fr-FR':'es-ES', {day:'numeric', month:'short', year:'numeric'}); }

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  if(state.stage==='loading'){ app.innerHTML = `<div class="centerscreen">${renderLangToggleFixed()}<p class="muted">…</p></div>`; attachLangOnly(); return; }
  if(state.stage==='nofirebase'){ app.innerHTML = renderNoFirebase(); attachLangOnly(); return; }
  if(state.stage==='welcome'){ app.innerHTML = renderWelcome(); attachWelcomeEvents(); return; }
  if(state.stage==='join'){ app.innerHTML = renderJoin(); attachJoinEvents(); return; }
  app.innerHTML = renderMain() + (state.sheet ? renderSheet() : '');
  attachMainEvents();
  if(state.sheet) attachSheetEvents();
}

function renderLangToggleFixed(){
  return `<div style="position:absolute;top:16px;right:20px;">${renderLangToggle()}</div>`;
}
function attachLangOnly(){
  const ls = document.getElementById('langswitch');
  if(ls) ls.addEventListener('click', e=>{ const s=e.target.closest('span'); if(!s) return; state.lang=s.dataset.lang; saveLang(); render(); });
}

  return `
    <div class="header">
      <div class="htitle">

      </div>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab ${state.activeTab==='foods'?'on':''}" data-tab="foods">${tt.tabFoods}</div>
      <div class="tab ${state.activeTab==='summary'?'on':''}" data-tab="summary">${tt.tabSummary}</div>

function renderFoodsList(foods){
  const tt = t();
  const chips = `<button class="catchip ${state.activeCategory==='all'?'on':''}" data-cat="all">${tt.catAll}</button>` +
    CATEGORIES.map(c=>`<button class="catchip ${state.activeCategory===c?'on':''}" data-cat="${c}">${tt.cats[c]}</button>`).join('');

  const filtered = state.activeCategory==='all' ? foods : foods.filter(f=>f.cat===state.activeCategory);

  if(filtered.length===0) return `<div class="catfilters">${chips}</div><div class="listpanel"><div class="empty">${tt.emptyFiltered}</div></div>`;
  const rows = filtered.map(f=>{
    const entry = getEntry(f.id);
    return `
      <div class="foodrow" data-open="${f.id}">
        <span class="f-emoji">${f.emoji}</span>
        <div class="f-mid">
          <span class="f-name">${esc(foodName(f))}</span>
          <span class="f-age">+${f.minAge}</span>

        <span class="pill ${entry.etat}">${tt.etatLabels[entry.etat]}</span>
      </div>
    `;
  }).join('');
  return `<div class="catfilters">${chips}</div><div class="listpanel">${rows}</div>`;
}

function renderSummaryList(foods){
  const tt = t();
  const tested = foods
    .filter(f=> getEntry(f.id).etat !== 'a_tester')
    .sort((a,b)=> new Date(getEntry(b.id).date||0) - new Date(getEntry(a.id).date||0));

  if(tested.length===0) return `<div class="listpanel"><div class="empty">${tt.summaryEmpty}</div></div>`;

  const rows = tested.map(f=>{
    const entry = getEntry(f.id);
    return `
      <div class="foodrow" data-open="${f.id}">
        <span class="f-emoji">${f.emoji}</span>
        <div class="f-mid">
          <span class="f-name">${esc(foodName(f))}</span>
          ${entry.date ? `<span class="f-age">${formatDate(entry.date)}</span>` : ''}
        </div>
        <span class="pill ${entry.etat}">${tt.etatLabels[entry.etat]}</span>
      </div>
    `;
  }).join('');
  return `<div class="listpanel">${rows}</div>`;
}

function renderAllergensList(foods){
  const tt = t();
  const rows = ALLERGENS.map(a=>{
    const related = foods.filter(f=>f.allergen===a.id);
    const tested = related.filter(f=>getEntry(f.id).etat!=='a_tester')
      .sort((x,y)=> new Date(getEntry(x.id).date||0) - new Date(getEntry(y.id).date||0));
    const first = tested[0];
    return `
      <div class="a-row ${first?'tested':''}">
        <div class="a-left"><span class="a-dot2"></span><span class="a-name">${a[state.lang]}</span></div>
        <span class="a-status">${first ? (getEntry(first.id).date ? formatDate(getEntry(first.id).date) : tt.etatLabels[getEntry(first.id).etat]) : tt.notTested}</span>

  }).join('');
  return `<div class="allergenpanel">${rows}</div>`;
}

        ` : `
          <div class="infobox">📝 ${tt.ageNote1} <b>${minAge}</b> ${tt.ageNote2} <i>${tt.ageNote3}</i></div>
          <a class="recipebtn" href="https://www.google.com/search?q=${searchQuery}" target="_blank" rel="noopener">
            ${ICONS.bulb} ${tt.recipeIdeas} ${esc(name).toLowerCase()}
          </a>
        `}

        <div class="field-label">${tt.etat}</div>
        <div class="etatgrid">${etatBtns}</div>

        <div class="field-label">${tt.date}</div>
        <input type="date" id="sheet-date" value="${d.date||''}" />

        <div class="field-label">${tt.notes}</div>
        <textarea id="sheet-notes" rows="3" placeholder="${tt.notesPh}">${esc(d.notes)}</textarea>

        <div class="err hidden" id="sheet-err" style="color:var(--strong);font-size:12px;margin:-10px 0 12px;">${tt.nameRequired}</div>

        <div class="sheet-actions">
          <button class="btn-cancel" id="sheet-cancel">${tt.cancel}</button>
          <button class="btn-save" id="sheet-save">${tt.save}</button>
        </div>
      </div>
    </div>
  `;
}

/* ================= EVENTS ================= */
function attachMainEvents(){
  document.getElementById('gear-btn').addEventListener('click', ()=>{
    state.showSettings = !state.showSettings;
    render();
  });

  const ls = document.getElementById('langswitch');
  if(ls) ls.addEventListener('click', (e)=>{
    const s = e.target.closest('span'); if(!s) return;
    state.lang = s.dataset.lang; saveLang(); render();
  });

  const cb = document.getElementById('copy-code-btn');
  if(cb) cb.addEventListener('click', ()=>{
    try{ navigator.clipboard.writeText(state.familyCode); }catch(e){}
    state.copied = true; render();
    setTimeout(()=>{ state.copied=false; if(state.showSettings) render(); }, 1500);
  });

  const lfb = document.getElementById('leave-family-btn');
  if(lfb) lfb.addEventListener('click', ()=>{
    if(confirm(t().resetConfirm)) leaveFamily();
  });

  document.getElementById('tabs').addEventListener('click', (e)=>{
    const tb = e.target.closest('[data-tab]'); if(!tb) return;
    state.activeTab = tb.dataset.tab; render();
  });

  const catFilters = document.querySelector('.catfilters');
  if(catFilters) catFilters.addEventListener('click', (e)=>{
    const cb = e.target.closest('[data-cat]'); if(!cb) return;
    state.activeCategory = cb.dataset.cat; render();
  });

  document.querySelectorAll('[data-open]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.dataset.open;
      const entry = getEntry(id);
      state.sheet = {mode:'edit', foodId:id};
      state.draft = {etat:entry.etat, date:entry.date, testedBy:entry.testedBy, notes:entry.notes};
      render();
    });
  });

  document.getElementById('fab-add').addEventListener('click', ()=>{
    state.sheet = {mode:'new'};
    state.draft = {name:'', minAge:6, cat:'autres', etat:'a_tester', date:new Date().toISOString().slice(0,10), testedBy:'', notes:''};
    render();
  });
}

function attachSheetEvents(){
  const overlay = document.getElementById('sheet-overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });
  document.getElementById('sheet-cancel').addEventListener('click', closeSheet);

  document.querySelectorAll('.etatbtn').forEach(b=>b.addEventListener('click', ()=>{
    state.draft.etat = b.dataset.etat; render();
  }));

  document.getElementById('sheet-date').addEventListener('input', e=>{ state.draft.date = e.target.value; });
  document.getElementById('sheet-notes').addEventListener('input', e=>{ state.draft.notes = e.target.value; });

  if(state.sheet.mode==='new'){
    document.getElementById('new-food-name').addEventListener('input', e=>{ state.draft.name = e.target.value; });
    document.getElementById('new-food-age').addEventListener('input', e=>{ state.draft.minAge = parseInt(e.target.value)||0; });
    document.getElementById('new-food-cat').addEventListener('change', e=>{ state.draft.cat = e.target.value; });
  }

  document.getElementById('sheet-save').addEventListener('click', ()=>{
    if(state.sheet.mode==='new'){
      if(!state.draft.name.trim()){ document.getElementById('sheet-err').classList.remove('hidden'); return; }
      const id = uid();
      state.customFoods.push({id, nameFr:state.draft.name.trim(), nameEs:state.draft.name.trim(), emoji:'🍽️', minAge:state.draft.minAge, allergen:null, cat:state.draft.cat});
      saveCustom();
      state.entries[id] = {etat:state.draft.etat, date:state.draft.date, testedBy:state.draft.testedBy, notes:state.draft.notes.trim()};
      saveEntries();
    } else {
      state.entries[state.sheet.foodId] = {etat:state.draft.etat, date:state.draft.date, testedBy:state.draft.testedBy, notes:state.draft.notes.trim()};
      saveEntries();
    }
    closeSheet();
  });
}
function closeSheet(){ state.sheet=null; state.draft=null; render(); }

/* ================= INIT ================= */
initFromLocalCode();
</script>
</body>
</html>
